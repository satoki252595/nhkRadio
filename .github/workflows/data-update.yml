name: Update Programs Data

on:
  schedule:
    # 毎日 19:30 UTC (JST 04:30) に実行
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      include_radiko:
        description: 'Radiko (民放) の番組表も取得する'
        type: boolean
        default: true

permissions:
  contents: write  # data/*.json を自動コミット

# scheduled cron と手動 dispatch が重なると、git push 同士が衝突して
# 片方が落ちる。直列化して常に最新状態を維持する。
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install openvpn
        run: sudo apt-get update && sudo apt-get install -y openvpn

      - name: Install Python dependencies
        run: pip install httpx pyyaml

      # VPN Gate 経由でRadiko番組表も取得
      - name: Fetch VPN Gate JP server
        if: github.event_name == 'schedule' || inputs.include_radiko
        run: python -m nhk_recorder.vpngate vpn.ovpn

      - name: Connect to VPN Gate
        id: vpn_connect
        if: github.event_name == 'schedule' || inputs.include_radiko
        uses: kota65535/github-openvpn-connect-action@v3
        with:
          config_file: vpn.ovpn
        # VPN 失敗を fatal にしない (NHK 部分だけでも更新したいため)。
        # 後続 step は steps.vpn_connect.outcome を見て --include-radiko を
        # 出し分けることで、国外 IP のまま Radiko を取りに行く事故を防ぐ。
        continue-on-error: true

      - name: Generate data files (NHK + Radiko)
        # JP13=東京, JP27=大阪 両方の番組表を取得してシリーズ一覧を充実。
        # VPN 接続失敗 or 手動 dispatch で include_radiko=false の場合は
        # NHK のみを取得し、Radiko 部分はスキップする (誤データ commit 防止)。
        run: |
          ARGS="--days 7 --past-days 7 --output-dir ./data"
          if [ "${{ steps.vpn_connect.outcome }}" = "success" ]; then
            ARGS="$ARGS --include-radiko --radiko-areas JP13,JP27"
            echo "VPN OK: NHK + Radiko を取得"
          else
            echo "VPN 未接続 (outcome=${{ steps.vpn_connect.outcome }}): NHK のみ取得、Radiko スキップ"
          fi
          python -m nhk_recorder.data_export $ARGS
        env:
          NHK_API_KEY: ${{ secrets.NHK_API_KEY }}

      - name: Copy data to web static
        run: |
          mkdir -p web/static/data
          cp -f data/series.json web/static/data/
          cp -f data/programs-latest.json web/static/data/
          cp -f data/programs-*.json web/static/data/ 2>/dev/null || true

      - name: Disconnect VPN
        if: always()
        run: |
          sudo pkill -f openvpn || true
          # ルーティングが戻るのを少し待つ
          sleep 3
          # github.com への到達確認
          curl -sSfI --max-time 10 https://github.com > /dev/null

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/static/data/
          git diff --staged --quiet || git commit -m "chore: update programs data"
          git push
