name: Playback
options:
  bundleIdPrefix: dev.satoki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: QVUR5T7J46
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1"
    BUILD_SOURCE_COMMIT: "UNSET"
targets:
  Playback:
    type: application
    platform: iOS
    sources:
      - Playback
    resources:
      - Playback/Resources
    info:
      path: Playback/Info.plist
      properties:
        CFBundleDisplayName: Playback
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: dev.satoki.playback.oauth
            CFBundleURLSchemes:
              - playbacknotion
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BuildSourceCommit: $(BUILD_SOURCE_COMMIT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.satoki.playback
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Playback/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
  PlaybackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlaybackTests
    dependencies:
      - target: Playback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.satoki.playback.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Playback:
    build:
      targets:
        Playback: all
        PlaybackTests: [test]
    test:
      targets:
        - PlaybackTests
